<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>AI Trading Office · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0E17; --surface:#131826; --border:#1F2937; --gold:#F5B942; --buy:#10B981; --sell:#EF4444; --warn:#F59E0B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:#E5E7EB; overflow:hidden; }
  .app { height:100vh; display:flex; flex-direction:column; }
  .topbar { height:56px; padding:0 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:rgba(10,14,23,0.95); backdrop-filter:blur(12px); flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#F5B942,#CA8A04); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--bg); font-size:13px; }
  .title { font-size:14px; font-weight:600; }
  .subtitle { font-size:10px; color:#6B7280; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .live { display:flex; align-items:center; gap:6px; font-size:11px; color:#9CA3AF; }
  .live .dot { width:8px; height:8px; border-radius:50%; background:var(--buy); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .clock { font-family:'JetBrains Mono',monospace; font-size:12px; color:#6B7280; }
  .kill-btn { padding:6px 12px; border-radius:8px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:var(--sell); font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; font-family:inherit; }
  .kill-btn:hover { background:rgba(239,68,68,0.2); }
  .kill-btn.active { background:var(--sell); color:#fff; }
  .main { flex:1; display:flex; gap:16px; padding:16px; min-height:0; }
  .stage { flex:1; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:radial-gradient(ellipse at center,#0F1626 0%,#0A0E17 70%); }
  #office { display:block; width:100%; height:100%; }
  .legend { position:absolute; bottom:12px; left:12px; background:rgba(19,24,38,0.85); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:10px; }
  .legend-title { font-weight:600; font-size:11px; margin-bottom:6px; }
  .legend-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; }
  .legend-item { display:flex; align-items:center; gap:6px; color:#9CA3AF; }
  .legend-item span { width:8px; height:8px; border-radius:2px; }
  .side { width:288px; display:flex; flex-direction:column; gap:12px; flex-shrink:0; min-height:0; }
  .log-panel { background:rgba(19,24,38,0.85); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:12px; padding:12px; flex:1; display:flex; flex-direction:column; min-height:0; }
  .log-header { display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:600; margin-bottom:8px; }
  .log-count { font-family:'JetBrains Mono',monospace; font-size:10px; color:#6B7280; }
  .log-list { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; font-size:11px; font-family:'JetBrains Mono',monospace; }
  .log-entry { display:flex; align-items:flex-start; gap:6px; animation:fade 0.3s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }
  .log-who { min-width:24px; font-weight:600; }
  .log-time { color:#6B7280; font-size:10px; }
  .log-msg { color:#D1D5DB; flex:1; }
  .status-panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; font-size:11px; }
  .status-title { font-size:12px; font-weight:600; margin-bottom:8px; }
  .status-row { display:flex; justify-content:space-between; padding:3px 0; }
  .status-row span:first-child { color:#6B7280; }
  .status-row span:last-child { font-family:'JetBrains Mono',monospace; }
  .gold{color:var(--gold);} .green{color:var(--buy);} .warn{color:var(--warn);}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">Au</div>
      <div>
        <div class="title">AI Trading Office · Live</div>
        <div class="subtitle">XAUUSD · M15 · 6 staf AI bertugas</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="live"><span class="dot"></span><span>Live sim</span></div>
      <div class="clock" id="clock">--:--:--</div>
      <button class="kill-btn" id="killSwitch">⏻ Kill Switch</button>
    </div>
  </header>
  <div class="main">
    <div class="stage">
      <canvas id="office"></canvas>
      <div class="legend">
        <div class="legend-title">Departments</div>
        <div class="legend-grid">
          <div class="legend-item"><span style="background:#3B82F6"></span>Analysis</div>
          <div class="legend-item"><span style="background:#F5B942"></span>Control</div>
          <div class="legend-item"><span style="background:#F59E0B"></span>Risk</div>
          <div class="legend-item"><span style="background:#10B981"></span>Execution</div>
          <div class="legend-item"><span style="background:#A855F7"></span>Research</div>
          <div class="legend-item"><span style="background:#06B6D4"></span>Review</div>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="log-panel">
        <div class="log-header"><span>Event Log</span><span class="log-count" id="counter">0</span></div>
        <div id="log" class="log-list"></div>
      </div>
      <div class="status-panel">
        <div class="status-title">Live Status</div>
        <div class="status-row"><span>Equity</span><span class="gold">$10,847.32</span></div>
        <div class="status-row"><span>Daily P/L</span><span class="green">+$182.40</span></div>
        <div class="status-row"><span>Open Pos</span><span>2 / 3</span></div>
        <div class="status-row"><span>Drawdown</span><span class="warn">-1.2%</span></div>
      </div>
    </aside>
  </div>
</div>
<script>
const canvas = document.getElementById('office');
const ctx = canvas.getContext('2d');
let W=0,H=0;
const TILE={W:56,H:28}, GRID={W:14,H:10};
let ORIGIN={x:0,y:0};

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.floor(r.width*dpr);
  canvas.height=Math.floor(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=r.width; H=r.height;
  ORIGIN.x=W/2; ORIGIN.y=Math.max(130,H/2-80);
}
window.addEventListener('resize',resize);

function iso(gx,gy){return{x:ORIGIN.x+(gx-gy)*TILE.W/2,y:ORIGIN.y+(gx+gy)*TILE.H/2};}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const AGENT_CONFIG={
  MA:{id:'MA',name:'Market Analyst',color:'#3B82F6',homeX:2.5,homeY:2.5},
  DL:{id:'DL',name:'Desk Lead',color:'#F5B942',homeX:7,homeY:2.5},
  RM:{id:'RM',name:'Risk Manager',color:'#F59E0B',homeX:11.5,homeY:2.5},
  EX:{id:'EX',name:'Execution',color:'#10B981',homeX:2.5,homeY:7.5},
  NS:{id:'NS',name:'News Analyst',color:'#A855F7',homeX:7,homeY:7.5},
  TR:{id:'TR',name:'Trade Reviewer',color:'#06B6D4',homeX:11.5,homeY:7.5}
};
const DEPT_LABELS=[
  {text:'ANALYSIS',x:2.5,y:1,color:'#3B82F6'},
  {text:'CONTROL',x:7,y:1,color:'#F5B942'},
  {text:'RISK',x:11.5,y:1,color:'#F59E0B'},
  {text:'EXECUTION',x:2.5,y:6,color:'#10B981'},
  {text:'RESEARCH',x:7,y:6,color:'#A855F7'},
  {text:'REVIEW',x:11.5,y:6,color:'#06B6D4'}
];

const STATE={running:true,workflowActive:true,lastT:performance.now()};
const agents=Object.values(AGENT_CONFIG).map(c=>({...c,x:c.homeX,y:c.homeY,state:'working',path:[],speed:1.8,bubble:null,bubbleColor:'#fff',bubbleTimer:0,typing:0}));
const A={}; agents.forEach(a=>A[a.id]=a);
const desks=agents.map(a=>({x:a.homeX-0.4,y:a.homeY-0.4,accent:a.color}));

function update(dt){
  agents.forEach(a=>{
    if(a.state==='walking'&&a.path.length>0){
      const t=a.path[0], dx=t.x-a.x, dy=t.y-a.y, d=Math.hypot(dx,dy);
      if(d<0.05){a.x=t.x;a.y=t.y;a.path.shift();if(a.path.length===0)a.state='working';if(t.cb)t.cb();}
      else{const s=Math.min(a.speed*dt,d);a.x+=dx/d*s;a.y+=dy/d*s;}
    }
    if(a.bubbleTimer>0){a.bubbleTimer-=dt;if(a.bubbleTimer<=0)a.bubble=null;}
    if(a.typing>0)a.typing-=dt;
  });
}
function walk(a,tx,ty){return new Promise(resolve=>{a.state='walking';a.path=[{x:tx,y:ty,cb:resolve}];});}

function drawFloor(){
  for(let y=0;y<GRID.H;y++)for(let x=0;x<GRID.W;x++){
    const c=iso(x,y), dark=(x+y)%2===0;
    ctx.beginPath();
    ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+TILE.W/2,c.y+TILE.H/2);
    ctx.lineTo(c.x,c.y+TILE.H);ctx.lineTo(c.x-TILE.W/2,c.y+TILE.H/2);
    ctx.closePath();
    ctx.fillStyle=dark?'#111826':'#0D121D';ctx.fill();
    ctx.strokeStyle='rgba(31,41,55,0.55)';ctx.lineWidth=1;ctx.stroke();
  }
}
function drawDeptLabels(){
  DEPT_LABELS.forEach(l=>{
    const c=iso(l.x,l.y);
    ctx.save();ctx.globalAlpha=0.16;ctx.fillStyle=l.color;
    ctx.font='bold 20px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText(l.text,c.x,c.y);ctx.restore();
  });
  const mt=iso(7,4.5);
  ctx.beginPath();
  ctx.moveTo(mt.x,mt.y-22);ctx.lineTo(mt.x+65,mt.y);
  ctx.lineTo(mt.x,mt.y+22);ctx.lineTo(mt.x-65,mt.y);
  ctx.closePath();ctx.fillStyle='#1E293B';ctx.fill();
  ctx.strokeStyle='#334155';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(156,163,175,0.55)';ctx.font='9px Inter';ctx.textAlign='center';
  ctx.fillText('MEETING',mt.x,mt.y+4);
}
function drawPlant(x,y){
  ctx.fillStyle='#78350F';ctx.fillRect(x-8,y-10,16,12);
  ctx.fillStyle='#166534';ctx.beginPath();ctx.arc(x,y-20,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#22C55E';ctx.beginPath();
  ctx.arc(x-4,y-24,6,0,Math.PI*2);ctx.arc(x+5,y-22,5,0,Math.PI*2);ctx.fill();
}
function drawCoffee(x,y){
  ctx.fillStyle='#334155';ctx.fillRect(x-10,y-20,20,22);
  ctx.fillStyle='#0F172A';ctx.fillRect(x-6,y-16,12,8);
  ctx.fillStyle='#EF4444';ctx.fillRect(x-3,y-5,6,2);
  const t=performance.now()/500;
  ctx.strokeStyle='rgba(156,163,175,0.35)';ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){
    ctx.beginPath();const sx=x-4+i*4,sy=y-22-i*3;
    ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sx+Math.sin(t+i)*3,sy-6,sx,sy-10);ctx.stroke();
  }
}
function drawDecorations(){
  const p1=iso(0.5,0.5);drawPlant(p1.x,p1.y+8);
  const p2=iso(13.5,9.5);drawPlant(p2.x,p2.y+8);
  const cf=iso(13,5);drawCoffee(cf.x,cf.y+8);
}
function drawDesk(d){
  const c=iso(d.x,d.y), dw=TILE.W*1.3, dh=TILE.H*1.3, legH=16;
  ctx.beginPath();ctx.moveTo(c.x-dw/2,c.y);ctx.lineTo(c.x,c.y+dh/2);
  ctx.lineTo(c.x,c.y+dh/2+legH);ctx.lineTo(c.x-dw/2,c.y+legH);ctx.closePath();
  ctx.fillStyle='#1E293B';ctx.fill();
  ctx.beginPath();ctx.moveTo(c.x+dw/2,c.y);ctx.lineTo(c.x,c.y+dh/2);
  ctx.lineTo(c.x,c.y+dh/2+legH);ctx.lineTo(c.x+dw/2,c.y+legH);ctx.closePath();
  ctx.fillStyle='#0B1120';ctx.fill();
  ctx.beginPath();ctx.moveTo(c.x-dw/2,c.y);ctx.lineTo(c.x,c.y-dh/2);
  ctx.lineTo(c.x+dw/2,c.y);ctx.lineTo(c.x,c.y+dh/2);ctx.closePath();
  ctx.fillStyle='#2A3444';ctx.fill();
  ctx.strokeStyle='#475569';ctx.lineWidth=1;ctx.stroke();
  const mx=c.x,my=c.y-4;
  ctx.fillStyle='#0A0E17';ctx.fillRect(mx-11,my-14,22,14);
  ctx.fillStyle=d.accent;ctx.fillRect(mx-9,my-12,18,10);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(mx-8,my-11,8,8);
  ctx.fillStyle='#0A0E17';ctx.fillRect(mx-2,my,4,3);ctx.fillRect(mx-5,my+3,10,2);
}
function drawAgent(a){
  const c=iso(a.x,a.y), sx=c.x, sy=c.y+14;
  const walking=a.state==='walking';
  const t=performance.now()/90;
  const legSwing=walking?Math.sin(t)*3:0;
  const armSwing=walking?Math.sin(t)*2:(a.typing>0?Math.sin(t*2.2)*1.5:0);
  ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(sx,sy,15,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle='#0F172A';
  ctx.fillRect(sx-8,sy-24,6,24+legSwing);
  ctx.fillRect(sx+2,sy-24,6,24-legSwing);
  ctx.fillStyle='#1E293B';
  ctx.fillRect(sx-8,sy-3+legSwing,6,3);ctx.fillRect(sx+2,sy-3-legSwing,6,3);
  ctx.fillStyle=a.color;ctx.fillRect(sx-11,sy-48,22,24);
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(sx-11,sy-48,4,24);
  ctx.fillStyle=a.color;
  ctx.fillRect(sx-15,sy-46+armSwing,4,18);
  ctx.fillRect(sx+11,sy-46-armSwing,4,18);
  ctx.fillStyle='#FDE047';
  ctx.fillRect(sx-15,sy-28+armSwing,4,4);
  ctx.fillRect(sx+11,sy-28-armSwing,4,4);
  ctx.fillStyle='#FDE047';rr(sx-10,sy-68,20,20,5);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.07)';rr(sx-10,sy-68,20,6,5);ctx.fill();
  ctx.fillStyle='#111';
  ctx.fillRect(sx-5,sy-61,2.5,3.5);ctx.fillRect(sx+2.5,sy-61,2.5,3.5);
  ctx.strokeStyle='#111';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(sx,sy-55,4,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  const nameY=sy-82;
  ctx.font='bold 10px Inter,sans-serif';ctx.textAlign='center';
  const tw=ctx.measureText(a.name).width;
  ctx.fillStyle='rgba(10,14,23,0.92)';rr(sx-tw/2-6,nameY-9,tw+12,15,4);ctx.fill();
  ctx.strokeStyle=a.color;ctx.lineWidth=1;rr(sx-tw/2-6,nameY-9,tw+12,15,4);ctx.stroke();
  ctx.fillStyle=a.color;ctx.fillText(a.name,sx,nameY+2);
  if(a.bubble){
    const by=nameY-16;
    ctx.font='bold 11px Inter,sans-serif';
    const bw=ctx.measureText(a.bubble).width+16;
    ctx.fillStyle=a.bubbleColor;rr(sx-bw/2,by-20,bw,20,8);ctx.fill();
    ctx.beginPath();ctx.moveTo(sx-4,by);ctx.lineTo(sx+4,by);ctx.lineTo(sx,by+6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0A0E17';ctx.fillText(a.bubble,sx,by-6);
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawFloor();drawDeptLabels();drawDecorations();
  const ds=[];
  desks.forEach(d=>ds.push({depth:d.x+d.y,draw:()=>drawDesk(d)}));
  agents.forEach(a=>ds.push({depth:a.x+a.y+0.1,draw:()=>drawAgent(a)}));
  ds.sort((a,b)=>a.depth-b.depth);ds.forEach(d=>d.draw());
}
function tick(now){
  const dt=Math.min((now-STATE.lastT)/1000,0.1);
  STATE.lastT=now;
  update(dt);render();
  if(STATE.running)requestAnimationFrame(tick);
}

let logCount=0;
function addLog(who,msg,color){
  logCount++;
  document.getElementById('counter').textContent=logCount;
  const log=document.getElementById('log');
  const e=document.createElement('div');
  e.className='log-entry';
  const time=new Date().toTimeString().slice(0,8);
  e.innerHTML=`<span class="log-who" style="color:${color}">${who}</span><span class="log-time">${time}</span><span class="log-msg">${msg}</span>`;
  log.prepend(e);
  while(log.children.length>30)log.removeChild(log.lastChild);
}

async function workflow(){
  while(STATE.running){
    await sleep(3000);
    if(!STATE.workflowActive)continue;
    A.MA.bubble='📊 SIGNAL';A.MA.bubbleColor='#3B82F6';A.MA.bubbleTimer=2;
    addLog('MA','FIB-01 setup on M15','#3B82F6');
    await sleep(2000);
    await walk(A.MA,A.DL.homeX-1.2,A.DL.homeY);
    A.MA.bubble='→ SIGNAL';A.MA.bubbleTimer=1.8;
    await sleep(1800);
    A.DL.bubble='✓ CHECK';A.DL.bubbleColor='#F5B942';A.DL.bubbleTimer=1.5;
    await sleep(1400);
    await walk(A.DL,A.RM.homeX-1.2,A.RM.homeY);
    A.DL.bubble='RISK?';A.DL.bubbleTimer=1.5;
    addLog('DL','Requesting risk approval','#F5B942');
    await sleep(1900);
    A.RM.bubble='✓ PASS';A.RM.bubbleColor='#F59E0B';A.RM.bubbleTimer=2;
    addLog('RM','Approved: SL 33p, lot 0.10','#F59E0B');
    await sleep(1900);
    A.EX.typing=2.5;A.EX.bubble='⚡ FILLED';A.EX.bubbleColor='#10B981';A.EX.bubbleTimer=2.5;
    addLog('EX','BUY 0.10 @ 2650.45','#10B981');
    await sleep(2400);
    A.MA.bubble=null;A.DL.bubble=null;
    await Promise.all([walk(A.MA,A.MA.homeX,A.MA.homeY),walk(A.DL,A.DL.homeX,A.DL.homeY)]);
    A.TR.typing=2;A.TR.bubble='✓ REVIEW';A.TR.bubbleColor='#06B6D4';A.TR.bubbleTimer=2;
    addLog('TR','Post-trade: +$42.30','#06B6D4');
    await sleep(2500);
    A.TR.bubble=null;
    addLog('SYS','Cycle complete · 3 trades today','#9CA3AF');
  }
}

setInterval(()=>{document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8);},1000);

document.getElementById('killSwitch').addEventListener('click',(e)=>{
  STATE.workflowActive=!STATE.workflowActive;
  const btn=e.currentTarget;
  if(STATE.workflowActive){
    btn.classList.remove('active');
    btn.textContent='⏻ Kill Switch';
    addLog('SYS','Trading workflow resumed','#10B981');
  } else {
    btn.classList.add('active');
    btn.textContent='⏸ STOPPED';
    addLog('SYS','KILL SWITCH — workflow paused','#EF4444');
    agents.forEach(a=>{a.bubble=null;a.bubbleTimer=0;a.typing=0;a.path=[];a.state='working';a.x=a.homeX;a.y=a.homeY;});
  }
});

resize();requestAnimationFrame(tick);workflow();
addLog('SYS','Office online · 6 staf AI','#9CA3AF');
</script>
</body>
                                                     </html>
